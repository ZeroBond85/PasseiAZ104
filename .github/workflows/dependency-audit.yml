name: dependency-audit

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev > .agent/audits/audit-$(date +%F).txt 2>&1 || true
      - run: npm outdated || true
