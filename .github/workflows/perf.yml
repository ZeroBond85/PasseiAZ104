name: perf

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: (npm run preview -- --port 4173 --strictPort >/tmp/preview.log 2>&1 &) && sleep 5
      - run: npx lighthouse http://127.0.0.1:4173/PasseiAZ104/?local=1 --preset=desktop --chrome-flags="--no-sandbox --headless=new" --output=json --output-path=/tmp/lh.json --max-wait-for-load=30000 --quiet
      - run: node scripts/check-lh.mjs /tmp/lh.json
