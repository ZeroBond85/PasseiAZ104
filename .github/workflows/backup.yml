name: backup

# Backup semanal do Supabase (Sprint 5, PLAN-3).
# Requer secret SUPABASE_DB_URL (connection string postgres de leitura).
# Sem o secret: pula silenciosamente (exit 0) — sem ruído.
# Restaura manual via SQL Editor.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checar secret
        id: gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "present=false" >> $GITHUB_OUTPUT
            echo "Secret SUPABASE_DB_URL ausente — backup pulado (configure em Settings → Secrets)."
            exit 0
          fi
          # Valida FORMATO sem exibir valor: tem que ser URI postgres, não URL https nem só senha.
          case "$SUPABASE_DB_URL" in
            postgresql://*)
              echo "present=true" >> $GITHUB_OUTPUT
              echo "Formato OK (postgresql://...)."
              ;;
            https://*)
              echo "present=false" >> $GITHUB_OUTPUT
              echo "::error::Valor é a URL da API (https://...), não a URI Postgres. Use Dashboard → Database → Connection string (aba URI), que começa com postgresql://."
              exit 1
              ;;
            *)
              echo "present=false" >> $GITHUB_OUTPUT
              stripped=$(printf '%s' "$SUPABASE_DB_URL" | tr -d "[:space:]'\"")
              if [ "$stripped" != "$SUPABASE_DB_URL" ]; then
                echo "::error::Valor com aspas ou espaços sobrando. Cole a URI pura, sem aspas e sem espaços no início/fim."
              elif printf '%s' "$SUPABASE_DB_URL" | grep -q '://'; then
                echo "::error::Formato desconhecido. A URI precisa começar exatamente com postgresql://."
              else
                echo "::error::Valor parece ser só a senha, sem a URI completa. Copie a Connection string inteira (postgresql://postgres:...)."
              fi
              exit 1
              ;;
          esac
      - name: pg_dump (schema+data, sem owner)
        if: steps.gate.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges \
            --file "supabase-backup-$(date +%F).sql"
          ls -la supabase-backup-*.sql
      - name: Upload artifact (retenção 90 dias)
        if: steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-$(date +%F)
          path: supabase-backup-*.sql
          retention-days: 90
